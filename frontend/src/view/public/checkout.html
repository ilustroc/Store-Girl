<section class="page-hero compact">
    <div class="container">
        <p class="eyebrow">Checkout</p>
        <h1>Confirmar pedido</h1>
        <p>Revisa tus datos y confirma tu compra en pocos pasos.</p>
    </div>
</section>

<section class="section-pad bg-white">
    <div class="container">
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="surface-card">
                    <h2>Resumen del pedido</h2>
                    <div id="checkout-items"></div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="surface-card">
                    <h2>Datos de compra</h2>
                    <div id="checkout-user"></div>
                    <div class="alert d-none mt-3" id="checkout-alert" role="alert"></div>
                    <form id="checkout-form" class="checkout-form mt-3" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="checkout-name">Nombre completo</label>
                            <input class="form-control" id="checkout-name" type="text" required>
                            <div class="invalid-feedback">Ingresa tu nombre completo.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="checkout-phone">Teléfono</label>
                            <input class="form-control" id="checkout-phone" type="tel" inputmode="numeric" maxlength="9" placeholder="9XXXXXXXX" required>
                            <div class="invalid-feedback">El teléfono debe contener 9 dígitos y comenzar con 9.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="checkout-address">Dirección o referencia</label>
                            <textarea class="form-control" id="checkout-address" rows="3" required></textarea>
                            <div class="invalid-feedback">Ingresa una dirección o referencia.</div>
                        </div>
                        <div>
                            <label class="form-label" for="checkout-comment">Comentario opcional</label>
                            <textarea class="form-control" id="checkout-comment" rows="2"></textarea>
                        </div>
                    </form>
                    <div class="summary-row total mt-3">
                        <span>Total</span>
                        <strong id="checkout-total">S/0.00</strong>
                    </div>
                    <button class="btn btn-primary w-100 mt-3" id="btn-confirm-order">
                        <i class="bi bi-check2-circle me-2"></i>Confirmar pedido
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
